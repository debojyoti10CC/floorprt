name: documentation-gates
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/docs-*.mjs'
      - 'packages/shared/src/abis.generated.ts'
      - 'apps/api/src/app.ts'
      - 'package.json'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/docs-*.mjs'
      - 'packages/shared/src/abis.generated.ts'
      - 'apps/api/src/app.ts'
      - 'package.json'
      - '.github/workflows/docs.yml'
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check
      - run: pnpm docs:links
