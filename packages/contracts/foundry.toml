[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["vendor", "../../node_modules"]
remappings = ["@openzeppelin/contracts/=../../node_modules/@openzeppelin/contracts/", "forge-std/=vendor/forge-std/src/"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 48
fail_on_revert = false
